name: build-images

# stage4 images only; the stage3 bases are built and pushed by
# build-stage3.yml (and stage4 builds pull the latest base via --pull=newer).
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated image dirs to build (empty = all)"
        type: string
        default: ""
  push:
    branches: [main]
    paths:
      - "images/stage4-*/**"
      - "images/stage4-common/**"
      - "scripts/build.sh"
      - ".github/workflows/build-images.yml"
      - ".github/actions/build-image/action.yml"
  schedule:
    # Weekly: pick up refreshed upstream packages/binpkgs. Runs an hour after
    # build-stage3.yml's weekly stage3 refresh.
    - cron: "0 4 * * 6"

permissions:
  contents: read

# Full @world builds are expensive; never run two CI builds concurrently.
concurrency:
  group: build-images
  cancel-in-progress: false

jobs:
  stage4:
    name: ${{ matrix.image }}
    runs-on: [self-hosted, linux, x64, podman]
    timeout-minutes: 720
    strategy:
      fail-fast: false
      matrix:
        image:
          - stage4-openrc
          - stage4-systemd
          - stage4-systemd-xfce4
          - stage4-systemd-xfce4-overlay
          - stage4-systemd-binhost
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/build-image
        with:
          image: ${{ matrix.image }}
          only: ${{ inputs.only }}
          dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}
