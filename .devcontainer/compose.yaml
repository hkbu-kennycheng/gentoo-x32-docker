services:
  x32-dev:
    build:
      context: ..
      dockerfile: .devcontainer/Containerfile.dev
    image: kennycheng/x32-dev:latest
    container_name: x32-dev
    hostname: x32-dev
    stdin_open: true
    tty: true
    volumes:
      # Mount the x32-overlay checkout (clone of hkbu-kennycheng/gentoo-x32-overlay)
      # at the canonical repos location.
      - ../gentoo-x32-overlay:/var/db/repos/x32-overlay:z
      # Persistent caches between runs
      - distfiles:/var/cache/distfiles
      - binpkgs:/var/cache/binpkgs
      - ccache:/var/cache/ccache
      # Persistent gentoo portage tree (survives container recreation)
      - gentoo:/var/db/repos/gentoo
    tmpfs:
      # Ebuild build dirs are ephemeral
      - /var/tmp/portage:size=16G
    command: sleep infinity

volumes:
  distfiles:
  binpkgs:
  ccache:
  gentoo:
